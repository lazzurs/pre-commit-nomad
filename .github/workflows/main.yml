---
name: Tag release
on:
  push:
    branches:
      - '!**'
      - 'main'

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check
          args: --from-latest-tag
        continue-on-error: true
      - name: Get next version
        id: next_version
        # cocogitto 6.4 exits 0 and prints informational lines on stdout
        # ("No conventional commits...", "Pre-Hooks and Post-Hooks have
        # been skipped.") even when no bump is needed, so only a bare
        # version line means a bump is required. Without this check the
        # bump step fails on pushes that need no release.
        run: |
          NEXT_VERSION=$(cog bump --auto --dry-run 2>/dev/null | grep -E "^v?[0-9]+\.[0-9]+\.[0-9]+$" | tail -n1) || true
          if [ -z "$NEXT_VERSION" ]; then
            echo "No version bump needed, skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version bump needed: $NEXT_VERSION"
          fi
      - name: Cocogitto tag
        id: release
        if: steps.next_version.outputs.skip != 'true'
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: bump
          args: --auto
          git-user: 'GitHubActions'
          git-user-email: 'github@lazzurs.org'
      - name: Generate release notes
        if: steps.next_version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        # `cog changelog --at` errors on non-conventional commits inside
        # the release range, so take the section cocogitto just wrote to
        # CHANGELOG.md during the bump instead.
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " { in_section=1; next }
            in_section && /^- - -$/ { exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
      - name: Upload github release
        if: steps.next_version.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          tag_name: ${{ steps.release.outputs.version }}
